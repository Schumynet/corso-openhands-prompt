plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.schumynet.pavo'
    compileSdk 34

    defaultConfig {
        applicationId "dev.schumynet.pavo"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmata con la chiave di debug: e' un APK da installare a mano,
            // non da pubblicare su un negozio.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
